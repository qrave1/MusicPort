name: Go checks
on: [push, pull_request]
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go generate ./...
      - shell: bash
        run: |
          git diff --exit-code
          test -z "$(git ls-files --others --exclude-standard -- '*_mock_test.go')"
      - run: go test -count=1 -tags=integration ./...
      - run: go vet ./...
      - run: go mod verify
      - run: go build .
      - if: runner.os == 'Linux'
        run: go test -race -tags=integration ./...
